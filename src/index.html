// ---------------- sounds: synthesized with Web Audio (no files), through a generated reverb ----------------
const SND = (() => {
  let ctx, out, verb
  const on = () => S.settings.sounds !== false
  function ac() {
    if (!ctx) {
      ctx = new AudioContext()
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3
      out = ctx.createGain(); out.gain.value = .8; out.connect(comp).connect(ctx.destination)
      // a 3.5 s hall: stereo noise that dies away, used as the reverb's impulse response
      const n = ctx.sampleRate * 3.5, ir = ctx.createBuffer(2, n, ctx.sampleRate)
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2.8 }
      verb = ctx.createConvolver(); verb.buffer = ir
      const wet = ctx.createGain(); wet.gain.value = .6; verb.connect(wet).connect(out)
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {})
    return ctx
  }
  const send = (node, wet) => { node.connect(out); const g = ctx.createGain(); g.gain.value = wet; node.connect(g).connect(verb) }
  function voice(f, at, dur, { type = 'sine', gain = .2, attack = .004, f2, glide = .08, wet = .5, pan = 0, cut } = {}) {
    const c = ac(), t0 = c.currentTime + at, o = c.createOscillator(), g = c.createGain(), p = c.createStereoPanner()
    o.type = type; o.frequency.setValueAtTime(f, t0)
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + glide)
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + attack); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur)
    p.pan.value = pan
    let last = o
    if (cut) { const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(cut[0], t0); lp.frequency.exponentialRampToValueAtTime(cut[1], t0 + dur * .6); o.connect(lp); last = lp }
    last.connect(g).connect(p); send(p, wet); o.start(t0); o.stop(t0 + dur + .1)
  }
  function noise(at, dur, { f1 = 800, f2 = 800, q = 1, gain = .1, type = 'bandpass', wet = .4, attack = .45 } = {}) {
    const c = ac(), n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0)
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(), t0 = c.currentTime + at
    s.buffer = b; fl.type = type; fl.Q.value = q
    fl.frequency.setValueAtTime(f1, t0); fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur)
    const a = attack < 1 ? dur * attack : attack
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + Math.max(a, .005)); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur)
    s.connect(fl).connect(g); send(g, wet); s.start(t0)
  }
  // metal: a struck tone with the inharmonic partials of a small bell
  const bell = (f, at, gain, pan = 0) => {
    voice(f, at, 2.6, { gain, wet: .65, pan })
    voice(f * 2.76, at, 1.2, { gain: gain * .3, wet: .65, pan })
    voice(f * 5.4, at, .5, { gain: gain * .12, wet: .65, pan })
  }
  // a liquid drop: a quick upward "bloop" that rings like metal
  const blip = (f, at, gain, pan = 0) => { voice(f * .5, at, .16, { f2: f * 1.1, glide: .06, gain, wet: .35, pan }); bell(f, at + .03, gain * .45, pan) }
  const play = fn => (...a) => { if (on()) try { fn(...a) } catch {} }
  const NOTES = [659.3, 830.6, 987.8, 1108.7, 1318.5] // E major pentatonic, one per drop
  return {
    // warm pad that opens up while the drops gather
    ambient: play(() => {
      ;[[110, -.4], [164.8, .4], [220, -.2], [277.2, .2]].forEach(([f, pan], i) => {
        voice(f, i * .15, 7, { type: 'triangle', gain: .045, attack: 2.2, wet: .7, pan, cut: [300, 2200] })
        voice(f * 1.004, i * .15, 7, { type: 'triangle', gain: .03, attack: 2.4, wet: .7, pan: -pan, cut: [300, 2200] })
      })
      noise(0, 5, { f1: 300, f2: 3000, q: .6, gain: .02, wet: .8, attack: .6 })
    }),
    merge: play(i => blip(NOTES[i % 5], 0, .14, [-.6, .5, -.3, .3, 0][i % 5])),
    settle: play(() => [1318.5, 1661.2, 1975.5, 2637].forEach((f, i) => bell(f, i * .07, .04, (i - 1.5) * .35))),
    fall: play(() => noise(0, .75, { f1: 3000, f2: 260, q: 2.5, gain: .06, wet: .3, attack: .7 })),
    splash: play(() => {
      voice(95, 0, .6, { f2: 38, glide: .35, gain: .55, wet: .3 })                      // the thud
      noise(0, 1.1, { type: 'lowpass', f1: 4000, f2: 300, q: .7, gain: .22, wet: .6, attack: .01 }) // the splash
      blip(1318.5, .06, .12); blip(987.8, .2, .08, .45); blip(1661.2, .33, .06, -.45); blip(1975.5, .5, .04, .2) // droplets landing
    }),
    tick: play(() => voice(2400, 0, .06, { gain: .035, wet: .2 })),
    whoosh: play(() => noise(0, .45, { f1: 500, f2: 2600, q: 1.2, gain: .05, wet: .35 })),
    chime: play(() => [783.99, 987.77, 1174.66, 1567.98].forEach((f, i) => bell(f, i * .08, .06, (i - 1.5) * .3))),
  }
})()

// ---------------- welcome: 3D liquid-metal intro + setup steps ----------------
// The intro is one raymarched shader. Five drops of liquid metal fly in and merge (one note each), settle into a droplet
// that mirrors your wallpaper, then on "Get started" it falls, splashes, and a ripple opens up onto the browser.
const ONB = (() => {
  const el = $('#onb'), cv = $('#onb-gl'), stage = $('.ostage')
  let gl, U = {}, raf = 0, start = 0, fallAt = 0, step = -1, timers = [], texFor = ''
  const ARRIVE = [.75, 1.05, 1.35, 1.65, 1.95] // seconds when each drop joins (keep in sync with the shader)
  const FRAG = `precision highp float;
uniform vec2 R; uniform float t, f; uniform sampler2D env;
#define PI 3.14159265
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float ease(float x){x=clamp(x,0.,1.);return 1.-pow(1.-x,3.);}
float roundCone(vec3 p,float r1,float r2,float h){
  float b=(r1-r2)/h,a=sqrt(1.-b*b);vec2 q=vec2(length(p.xz),p.y);float k=dot(q,vec2(-b,a));
  if(k<0.)return length(q)-r1; if(k>a*h)return length(q-vec2(0.,h))-r2; return dot(q,vec2(a,b))-r1;}
float fallY(){return f>0.?-4.6*f*f:0.;}
float map(vec3 p){
  p.y-=fallY()+.04*sin(t*1.3);
  float st=f>0.?min(f*1.2,.45):0.; p.y/=1.+st; p.xz*=1.+st*.4;          // stretch as it falls
  float m=smoothstep(2.1,3.1,t), cr=.24+.34*ease((t-.4)/1.8);
  vec3 q=p; q.y+=.42;
  float d=roundCone(q,cr,mix(cr,.035,m),.001+1.08*m);
  for(int i=0;i<5;i++){
    float fi=float(i), tc=.75+.3*fi, k=pow(clamp(t/tc,0.,1.),2.2), a=fi*1.2566+t*.9, r=mix(2.4,0.,k);
    vec3 o=vec3(cos(a)*r,sin(a*1.3+fi)*.7*r-.42,sin(a)*r);
    d=smin(d,length(p-o)-.21*(1.-smoothstep(tc,tc+.45,t)),.38);
  }
  float w=.03*exp(-max(t-2.,0.))+.005;
  for(int i=0;i<5;i++){float tc=.75+.3*float(i); w+=.03*exp(-max(t-tc,0.)*5.)*step(tc,t);} // jiggle on each merge
  d+=w*sin(6.*p.x+t*4.)*sin(6.*p.y-t*3.3)*sin(6.*p.z+t*2.7);
  return d*.72;}
vec3 nrm(vec3 p){vec2 e=vec2(.001,-.001);return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx));}
// the wallpaper wrapped around the scene like a dome, mirrored so it has no seam
vec3 envc(vec3 d,float b){
  float u=atan(d.x,-d.z)/PI; u=1.-abs(u);
  float v=.5-asin(clamp(d.y,-1.,1.))/PI*1.25;
  b+=3.5*smoothstep(.8,1.,abs(d.y))+2.5*(1.-smoothstep(0.,.08,min(u,1.-u))); // soften the wrap seam and the poles
  vec3 c=texture2D(env,vec2(u,clamp(v,0.,1.)),b).rgb; return c*c;}
vec3 tone(vec3 c){c=1.-exp(-c*1.9);return sqrt(c);}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y, sv=gl_FragCoord.xy/R;
  float a=.4+t*.18; vec3 ro=vec3(sin(a)*5.5,.6,cos(a)*5.5), ta=vec3(0.,-.5,0.);
  vec3 fw=normalize(ta-ro), r=normalize(cross(vec3(0,1,0),fw)), up=cross(fw,r), rd=normalize(fw*1.5+uv.x*r+uv.y*up);
  // backdrop: the same photo, deeply blurred and dimmed, glowing in from black
  vec2 bu=vec2(.5+(sv.x-.5)*R.x/R.y*.56,1.-sv.y);
  vec3 col=texture2D(env,clamp(bu,0.,1.),7.).rgb; col=col*col*(.16+.1*smoothstep(1.6,3.,t));

  for(int i=0;i<96;i++){vec3 p=ro+rd*d;h=map(p);if(h<.0008){hit=true;break;}d+=h;if(d>14.)break;}
  if(hit){

    vec3 m=envc(rf,1.2)*mix(vec3(.78,.8,.85),vec3(1.),fr)*1.35;                 // a silver mirror
    m+=vec3(1.)*pow(max(dot(rf,normalize(vec3(-.4,.85,.5))),0.),90.)*3.;             // key light
    m+=vec3(.9,.95,1.)*pow(max(dot(rf,normalize(vec3(.8,.3,-.4))),0.),40.)*.6;       // rim light
    m*=.75+.25*smoothstep(-.6,.4,n.y);                                               // a little occlusion underneath

  }

  if(f>.62){
    float T=f-.62, rr=2.2*T+1.6*T*T; vec2 c=vec2(0.,-.66), dv=uv-c; float s=length(dv)-rr, w=.05+.05*T;
    float crest=exp(-s*s/(w*w)), e=.003, s2=s+e, crest2=exp(-s2*s2/(w*w));

  function setupGL() {

    const prog = gl.createProgram()
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'))
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG))

    gl.useProgram(prog)
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())

  }
  // the current wallpaper becomes the environment the metal reflects (power-of-two copy so it can be mipmapped/blurred)
  async function loadEnv() {
    const id = S.settings.wall
    if (texFor === id) return
    try {
      const img = new Image(); img.src = wallMem.get(id)?.url || (await buildWall(id)).url
      await img.decode()
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512
      c.getContext('2d').drawImage(img, 0, 0, 1024, 512)
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c)
      gl.generateMipmap(gl.TEXTURE_2D)
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR)
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
      texFor = id
    } catch {}
  }
  function frame(now) {
    const s = Math.min(devicePixelRatio, 2), w = Math.round(innerWidth * s), h = Math.round(innerHeight * s)
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h) }
    const t = S.settings.calm ? 6 : (now - start) / 1000
    gl.uniform1f(U.t, t); gl.uniform1f(U.f, fallAt ? (now - fallAt) / 1000 : 0); gl.uniform2f(U.R, w, h); gl.uniform1i(U.env, 0)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
    raf = S.settings.calm && !fallAt ? 0 : requestAnimationFrame(frame)
  }
  const later = (ms, f) => timers.push(setTimeout(f, S.settings.calm ? Math.min(ms, 200) : ms))

  // ---- steps ----
  const applyAll = id => { S.spaces.forEach(s => { s.theme = id; delete s.custom }); save(); render(); sync() }
  const LOOKS = ['glass', 'glass-dark', 'apple', 'apple-dark'].map(id => THEMES.find(t => t.id === id))
  const STEPS = [
    () => `<h2>Choose your look</h2><p class="osub">Pick a style. You can fine-tune everything later in Settings.</p>
      <div class="ogrid">${LOOKS.map(th => `<button class="tcard${space().theme === th.id ? ' on' : ''}" data-look="${th.id}"><span class="tprev${th.dark ? ' d' : ''}${th.glass ? ' g' : ''}${th.apple ? ' a' : ''}" style="--a:${th.c[0]};--b:${th.c[1]}"><i></i><i></i><i></i></span><span class="tname">${th.name}</span></button>`).join('')}</div>`,
    () => `<h2>Pick a wallpaper</h2><p class="osub">It fills your home screen and tints the whole window.</p>
      <div class="ogrid">${WALLS.map(([id, name]) => `<button class="wcard${S.settings.wall === id ? ' on' : ''}" data-wall="${id}"><img src="${wallThumb(id)}" alt="" loading="lazy"><span>${esc(name)}</span></button>`).join('')}</div>`,
    () => `<h2>Search your way</h2><p class="osub">Choose a search engine and where your tabs live.</p>
      <div class="oh">Search engine</div><div class="opills">${Object.entries(ENGINES).map(([k, [name, , dom]]) => `<button class="opill${S.settings.engine === k ? ' on' : ''}" data-engine="${k}"><img src="${ico('https://' + dom)}" alt="">${name}</button>`).join('')}</div>
      <div class="oh">Layout</div><div class="opills">
        <button class="opill${S.settings.toolbar !== 'sidebar' ? ' on' : ''}" data-tb="top">${svg('layout')}Top bar, like Safari</button>
        <button class="opill${S.settings.toolbar === 'sidebar' ? ' on' : ''}" data-tb="sidebar">${svg('side')}Everything in the sidebar, like Arc</button></div>`,
    () => `<h2>You're all set</h2><p class="osub">A few shortcuts worth knowing.</p>
      <div class="okeys"><div>New tab<kbd>Ctrl T</kbd></div><div>Show or hide the sidebar<kbd>Ctrl S</kbd></div>
      <div>See all tabs in 3D<kbd>Ctrl Shift A</kbd></div><div>Pin the current tab<kbd>Ctrl D</kbd></div><div>Settings<kbd>Ctrl ,</kbd></div></div>`,
  ]
  function card(i, dir) {
    const c = document.createElement('div')
    c.className = 'ocard enter' + (dir < 0 ? ' back' : '') + (step < 0 ? ' first' : '')
    const last = i === STEPS.length - 1
    c.innerHTML = STEPS[i]() + `<div class="ofoot"><div class="dots">${STEPS.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>
      <button class="obtn ghost" data-nav="-1"${i ? '' : ' disabled'}>Back</button><button class="obtn" data-nav="1">${last ? 'Start browsing' : 'Continue'}</button></div>`
    return c
  }
  function show(i, dir = 1) {
    const old = stage.querySelector('.ocard:not(.leave)'), c = card(i, dir)
    if (old) { old.classList.add('leave'); if (dir < 0) old.classList.add('back'); setTimeout(() => old.remove(), 800) }
    stage.append(c); void c.offsetWidth; c.classList.remove('enter')
    step = i
  }
  const refresh = () => { const c = stage.querySelector('.ocard:not(.leave)'); if (c) c.innerHTML = card(step, 1).innerHTML }
  stage.addEventListener('click', e => {
    const b = e.target.closest('button')
    if (!b) return
    const d = b.dataset
    if (d.nav) {
      const n = step + +d.nav
      if (n >= STEPS.length) return finish()
      if (n < 0) return
      SND.whoosh(); return show(n, +d.nav)
    }
    if (d.look) { applyAll(d.look); if (S.settings.winbg === 'theme') S.settings.winbg = 'blur' }
    else if (d.wall) { S.settings.wall = d.wall; if (S.settings.winbg === 'theme') S.settings.winbg = 'blur' }
    else if (d.engine) S.settings.engine = d.engine
    else if (d.tb) S.settings.toolbar = d.tb
    else return
    SND.tick(); save(); applyTheme(); render(); refresh()
  })

  async function begin() {
    if (!el.hidden) return
    timers.forEach(clearTimeout); timers = []
    el.hidden = false; el.className = ''; stage.innerHTML = ''; step = -1; fallAt = 0; cv.hidden = false
    $('#onb-snd').innerHTML = svg(S.settings.sounds === false ? 'volx' : 'vol')
    await freeze()
    invoke('ui_focus').catch(() => {})
    if (gl || setupGL()) {
      await Promise.race([loadEnv(), new Promise(r => setTimeout(r, 1200))])
      start = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame)
    } else cv.hidden = true
    SND.ambient()
    ARRIVE.forEach((s, i) => later(s * 1000, () => SND.merge(i)))
    later(2450, SND.settle)
    later(2700, () => el.classList.add('named'))
    later(3100, () => $('#onb-go').focus())
  }
  // "Get started": the drop falls, splashes, and the ripple opens onto the browser; then the first step slides in
  function toSteps() {
    if (el.classList.contains('falling') || el.classList.contains('steps')) return
    timers.forEach(clearTimeout); timers = []
    el.classList.add('named', 'falling')
    if (!gl || cv.hidden || S.settings.calm) return reveal()
    fallAt = performance.now(); if (!raf) raf = requestAnimationFrame(frame)
    SND.fall()
    later(620, SND.splash)
    later(1450, reveal)
  }
  function reveal() {
    el.classList.remove('falling'); el.classList.add('steps')
    setTimeout(() => { cancelAnimationFrame(raf); raf = 0 }, 450)
    show(0)
  }
  function finish() {
    SND.chime()
    const c = stage.querySelector('.ocard:not(.leave)')
    c?.classList.add('done')
    el.classList.remove('steps'); $('#onb-bg').style.opacity = 0
    S.onboarded = 1; save()
    setTimeout(() => {
      el.hidden = true; $('#onb-bg').style.opacity = ''; cancelAnimationFrame(raf); raf = 0
      thaw(true)
    }, 700)
  }
  $('#onb-go').onclick = toSteps
  $('#onb-skip').onclick = () => { if (el.classList.contains('steps')) finish(); else toSteps() }
  $('#onb-snd').onclick = () => { S.settings.sounds = S.settings.sounds === false; save(); $('#onb-snd').innerHTML = svg(S.settings.sounds === false ? 'volx' : 'vol'); SND.tick() }
  document.addEventListener('keydown', e => {
    if (el.hidden) return
    if (e.key === 'Escape' || (e.key === 'Enter' && !el.classList.contains('steps'))) { e.preventDefault(); e.stopImmediatePropagation(); $('#onb-skip').click() }
  }, true)
  return { begin, open: () => !el.hidden }
})()

// boot: drop tab views left over from a reloaded UI, paint once without animations, then show the window
body.style.setProperty('--sbw', (S.sbw || 264) + 'px')
body.classList.toggle('collapsed', !!S.collapsed)
applyMods()
invoke('tab_close_all').finally(() => {
  activate(space().active)
  if (!S.onboarded) ONB.begin()
  else invoke('pkg_pending').then(ps => ps.forEach(p => openPkgFile(p, 'opened from a file'))).catch(() => {})
  autoArchive(); setInterval(autoArchive, 10 * 60e3)
  requestAnimationFrame(() => requestAnimationFrame(() => { body.classList.remove('boot'); appWin.show() }))
})
</script>
</body>
</html>
