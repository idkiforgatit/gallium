name: Scan themes and mods
# Every theme and mod on the website is format-checked and virus-scanned (ClamAV) when it changes, and again weekly
# with fresh virus definitions. Results go to docs/packages/scan.json, which the Themes & Mods page shows.
on:
  push:
    branches: [main]
    paths: ['docs/packages/**', 'src/gformat.js', 'tools/scan.js', 'tools/gformat.test.js', '.github/workflows/scan.yml']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ClamAV and update virus definitions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Test the format checker
        run: node tools/gformat.test.js
      - name: Check and scan every package
        id: scan
        run: node tools/scan.js
        continue-on-error: true
      - name: Publish the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/packages/scan.json docs/gformat.js
          git diff --cached --quiet || { git commit -m "Update theme and mod scan results" && git push; }
      - name: Fail if a package didn't pass
        if: steps.scan.outcome == 'failure'
        run: exit 1
