name: Try the release builds
# Installs the released Windows, Mac and Linux builds on clean machines, opens Gallium, and takes screenshots
# so we can see it really starts. Run it by hand from the Actions tab after a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        default: v1.0.0
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Install the .deb and a virtual screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*_amd64.deb'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./Gallium_*_amd64.deb xvfb imagemagick dbus-x11 xdotool
          dpkg -L gallium | grep '/bin/'
      - name: Open Gallium and take screenshots
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            dbus-launch gallium > app.log 2>&1 & pid=$!
            sleep 12; import -window root shot-1.png
            sleep 15; import -window root shot-2.png
            xdotool search --pid $pid --onlyvisible windowactivate --sync key Return || xdotool key Return
            sleep 8; import -window root shot-3.png
            if kill -0 $pid; then echo "STILL RUNNING"; else echo "EXITED"; fi
            kill $pid || true'
          cat app.log | tail -30
          find ~ -name gallium.log -exec cat {} \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            shot-*.png
            app.log
  mac:
    runs-on: macos-latest
    steps:
      - name: Install the .dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*_universal.dmg'
          hdiutil attach Gallium_*_universal.dmg -mountpoint /Volumes/Gallium -nobrowse
          cp -R /Volumes/Gallium/Gallium.app /Applications/
          hdiutil detach /Volumes/Gallium
          codesign -dv /Applications/Gallium.app 2>&1 | head -5
          lipo -archs /Applications/Gallium.app/Contents/MacOS/*
      - name: Open Gallium and take screenshots
        run: |
          /Applications/Gallium.app/Contents/MacOS/gallium > app.log 2>&1 & pid=$!
          sleep 12; screencapture -x shot-1.png
          sleep 15; screencapture -x shot-2.png
          # press Return on "Get started", then Return again on the first step's Continue
          osascript -e 'tell application "System Events" to set frontmost of (first process whose unix id is '$pid') to true' || true
          osascript -e 'tell application "System Events" to key code 36' || true
          sleep 8; screencapture -x shot-3.png
          osascript -e 'tell application "System Events" to keystroke "s" using command down' || true
          sleep 4; screencapture -x shot-4.png
          if kill -0 $pid; then echo "STILL RUNNING"; else echo "EXITED"; fi
          kill $pid || true
          tail -30 app.log
          find ~/Library -name gallium.log -exec cat {} \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            shot-*.png
            app.log
  windows:
    runs-on: windows-latest
    steps:
      - name: Install with the setup .exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*_x64-setup.exe'
          $exe = (Get-ChildItem *_x64-setup.exe).FullName
          Start-Process $exe -ArgumentList '/S' -Wait
          Get-ChildItem "$env:LOCALAPPDATA\Gallium" | Select-Object -First 5
      - name: Open Gallium and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$name.png")
          }
          $p = Start-Process "$env:LOCALAPPDATA\Gallium\gallium.exe" -PassThru
          Start-Sleep 12; Shot shot-1
          Start-Sleep 15; Shot shot-2
          if ($p.HasExited) { "EXITED" } else { "STILL RUNNING"; Stop-Process $p.Id }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: shot-*.png
