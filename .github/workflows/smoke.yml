name: Try the release builds
# Installs the released Windows, Mac and Linux builds on clean machines with a colourful desktop picture,
# opens Gallium, goes through the welcome, and takes screenshots of the intro and of the browser itself
# (so the window material, the desktop blurred through the window, can be checked). Run it by hand after a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        default: v1.0.0
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the .deb and a virtual screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*_amd64.deb'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./Gallium_*_amd64.deb xvfb imagemagick dbus-x11 xdotool feh
      - name: Open Gallium and take screenshots
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            feh --bg-fill src/wallpapers/braies.jpg
            dbus-launch gallium > app.log 2>&1 & pid=$!
            sleep 14; import -window root shot-1.png
            xdotool key Return; sleep 6; xdotool key Escape; sleep 6
            import -window root shot-2.png
            if kill -0 $pid; then echo "STILL RUNNING"; else echo "EXITED"; fi
            kill $pid || true'
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: shot-*.png
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the .dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*_universal.dmg'
          hdiutil attach Gallium_*_universal.dmg -mountpoint /Volumes/Gallium -nobrowse
          cp -R /Volumes/Gallium/Gallium.app /Applications/
          hdiutil detach /Volumes/Gallium
          osascript -e 'tell application "System Events" to tell every desktop to set picture to POSIX file "'"$PWD"'/src/wallpapers/braies.jpg"' || true
      - name: Open Gallium and take screenshots
        run: |
          open /Applications/Gallium.app; sleep 14; pid=$(pgrep -n gallium)
          screencapture -x shot-1.png
          osascript -e 'tell application "System Events" to key code 36'; sleep 6
          osascript -e 'tell application "System Events" to key code 53'; sleep 6
          screencapture -x shot-2.png
          if kill -0 $pid; then echo "STILL RUNNING"; else echo "EXITED"; fi
          kill $pid || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: shot-*.png
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install with the setup .exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*_x64-setup.exe'
          Start-Process (Get-ChildItem *_x64-setup.exe).FullName -ArgumentList '/S' -Wait
          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern int SystemParametersInfo(int a, int b, string c, int d);'
          [W.U]::SystemParametersInfo(20, 0, "$PWD\src\wallpapers\braies.jpg", 3)
          # Windows Server has "Transparency effects" off, which turns window blur (Acrylic, Mica) into flat colour
          $k = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          "transparency was: " + (Get-ItemProperty $k -ErrorAction SilentlyContinue).EnableTransparency
          New-Item $k -Force | Out-Null; Set-ItemProperty $k EnableTransparency 1 -Type DWord
          rundll32.exe user32.dll,UpdatePerUserSystemParameters
      - name: Open Gallium and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$name.png")
          }
          $p = Start-Process "$env:LOCALAPPDATA\Gallium\gallium.exe" -PassThru
          Start-Sleep 14; Shot shot-1
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate($p.Id); $ws.SendKeys('{ENTER}'); Start-Sleep 6
          $null = $ws.AppActivate($p.Id); $ws.SendKeys('{ESC}'); Start-Sleep 6
          Shot shot-2
          if ($p.HasExited) { "EXITED" } else { "STILL RUNNING"; Stop-Process $p.Id }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: shot-*.png
